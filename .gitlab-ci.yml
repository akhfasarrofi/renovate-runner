stages:
  - test
  - renovate

# Checks notifier code on merge requests and on the default branch. Scheduled
# pipelines skip it, so Renovate never waits on tests.
test:
  stage: test
  image: golang:1.25
  script:
    - go vet ./...
    - go test -race ./...
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'

renovate:
  stage: renovate
  image: ghcr.io/renovatebot/renovate:full
  tags: [docker, linux]
  resource_group: renovate
  timeout: 3h
  variables:
    RENOVATE_CONFIG_FILE: "$CI_PROJECT_DIR/config.js"
    RENOVATE_BASE_DIR: "$CI_PROJECT_DIR/.renovate"
    RENOVATE_REPOSITORY_CACHE: "enabled"
  # Only reused when the next job lands on the same runner (no distributed cache).
  cache:
    key: renovate
    paths:
      - .renovate/cache/
  script:
    - renovate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
